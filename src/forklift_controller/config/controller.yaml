lift_controller_node:
  ros__parameters:
    lift_joint_name: "lift_joint"
    min_height: 0.0
    max_height: 1.2
    jog_speed: 0.05
    default_auto_speed: 0.08
    max_speed: 0.15
    height_tolerance: 0.01
    set_height_timeout_sec: 30.0
    control_loop_hz: 20.0

lift_driver_node:
  ros__parameters:
    use_hardware: false
    serial_port: "/dev/ttyUSB0"
    serial_baud: 115200
    publish_rate_hz: 50.0
    min_height: 0.0
    max_height: 1.2

lift_feedback_node:
  ros__parameters:
    moving_velocity_threshold: 0.005
  
lift_limit_node:
  ros__parameters:
    min_height: 0.0
    max_height: 1.2
    soft_margin: 0.05

lift_safety_node: 
  ros__parameters: {}