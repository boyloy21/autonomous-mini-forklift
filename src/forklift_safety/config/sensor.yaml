sensor_monitor_node:
  ros__parameters:
    lidar_timeout_sec: 1.0
    imu_timeout_sec: 0.5
    ultrasonic_timeout_sec: 1.0
    camera_timeout_sec: 2.0
    encoder_timeout_sec: 0.5
    check_rate_hz: 5.0

protective_field_node:
  ros__parameters:
    warning_distance: 1.5
    slow_distance: 0.8
    stop_distance: 0.4
    front_angle_deg: 90.0   # +/- this angle in front of the robot counts

obstacle_monitor_node:
  ros__parameters:
    obstacle_distance: 0.5
    check_rate_hz: 10.0