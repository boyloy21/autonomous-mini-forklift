---
# Clock bridge (sim time)
- ros_topic_name: "/clock"
  gz_topic_name: "/world/ware_house/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "ignition.msgs.Clock"
  direction: IGN_TO_ROS

# IMU bridge
- ros_topic_name: "/imu"
  gz_topic_name: "/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "ignition.msgs.IMU"
  direction: IGN_TO_ROS

# Odometry bridge
- ros_topic_name: "/odom"
  gz_topic_name: "/odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "ignition.msgs.Odometry"
  direction: IGN_TO_ROS

- ros_topic_name: "/lift_cmd"
  gz_topic_name: "/lift_cmd"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "ignition.msgs.Double"
  direction: BIDIRECTIONAL

# Joint state bridge
- ros_topic_name: "/joint_states"
  gz_topic_name: "/world/ware_house/model/forklift/joint_state"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "ignition.msgs.Model"
  direction: IGN_TO_ROS

# Command velocity bridge
- ros_topic_name: "/cmd_vel"
  gz_topic_name: "/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "ignition.msgs.Twist"
  direction: BIDIRECTIONAL

# TF bridge (optional)
- ros_topic_name: "/tf"
  gz_topic_name: "/tf"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "ignition.msgs.Pose_V"
  direction: IGN_TO_ROS

# Laser scan bridge 
- ros_topic_name: "/scan"
  gz_topic_name: "/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "ignition.msgs.LaserScan"
  direction: IGN_TO_ROS

- ros_topic_name: "/scan/points"
  gz_topic_name: "/scan/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "ignition.msgs.PointCloudPacked"
  direction: IGN_TO_ROS


# Camera bridge 
- ros_topic_name: "/camera/camera_info"
  gz_topic_name: "/camera/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "ignition.msgs.CameraInfo"
  direction: IGN_TO_ROS

- ros_topic_name: "/camera/points"
  gz_topic_name: "/camera/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "ignition.msgs.PointCloudPacked"
  direction: IGN_TO_ROS

- ros_topic_name: "/camera/image_raw"
  gz_topic_name: "/camera/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "ignition.msgs.Image"
  direction: IGN_TO_ROS


- ros_topic_name: "/camera/depth_image"
  gz_topic_name: "/camera/depth_image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "ignition.msgs.Image"
  direction: IGN_TO_ROS

- ros_topic_name: "/battery_charger_station/touched"
  gz_topic_name: "/battery_charger_station/touched"
  ros_type_name: "std_msgs/msg/Bool"
  gz_type_name: "ignition.msgs.Boolean"
  direction: IGN_TO_ROS



# Single robot (unnamespaced): contact pads of every charger_station
# (their shared sensor_contact topic) exposed as /charger_contact, the name
# forklift_docking's charging_contact_topic resolves to without a namespace.
# Multi-robot bridges the same Gazebo topic to <ns>/charger_contact per robot.
- ros_topic_name: "/charger_contact"
  gz_topic_name: "/charger_contacts"
  ros_type_name: "ros_gz_interfaces/msg/Contacts"
  gz_type_name: "ignition.msgs.Contacts"
  direction: IGN_TO_ROS
