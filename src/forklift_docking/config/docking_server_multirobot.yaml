# docking_server.yaml
#
# Configuration for opennav_docking's docking_server node. This node is
# NOT written by us -- it is the standard opennav_docking executable. We
# only configure it. See Step 6 in the README for a line-by-line
# explanation of every parameter below.

docking_server:
  ros__parameters:
    use_sim_time: true

    # --- Server-level behavior ---
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.05
    max_retries: 3
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5
    odom_topic: "namespace/odom"
    odom_duration: 0.3

    # --- Instance database (Step 3 file) ---
    dock_database: "/home/yunboyloy/miniforklift_ws/src/forklift_docking/config/dock_database.yaml"

    # --- Declare the 4 dock TYPES (plugin instances) ---
    # Each name here must exactly match a `type:` value used in
    # dock_database.yaml.
    dock_plugins: ["charging_dock", "station_dock", "pallet_pick_dock", "pallet_drop_dock"]

    # NOTE: This Humble build of opennav_docking only registers
    # SimpleChargingDock and TestFailureDock as available ChargingDock
    # plugins (SimpleNonChargingDock ships in later Nav2 releases, not
    # this backport). We use SimpleChargingDock for ALL four dock types,
    # including the non-charging pallet/station docks -- its charge
    # detection parameters (is_charging_topic, charging_threshold) simply
    # stay unused if no charge-sense hardware/topic is wired up, which is
    # harmless for pallet_pick_dock/pallet_drop_dock/station_dock.

    # Rear-contact charger, front-only camera. This Humble backport has no
    # per-dock dock_direction/rotate_to_dock (only the server-wide
    # dock_backwards, which would blind the camera for every dock type), so
    # DockRobot docks FORWARD here -- camera on the marker -- and the
    # caller (pallet_dock_workflow_node / task_manager CHARGE_APPROACH)
    # then turns around and reverses into the contact pad. Staging must
    # therefore FACE the dock (yaw offset 0.0): with 3.14 the camera
    # pointed away from the marker and initial perception timed out.
    charging_dock:
      plugin: "opennav_docking::SimpleChargingDock"
      docking_threshold: 0.05
      docking_threshold_angular: 0.05
      staging_x_offset: -0.5
      staging_yaw_offset: 0.2
      use_external_detection_pose: true
      external_detection_timeout: 3.0
      # Marker frame x points along the robot's heading (forklift_aruco's
      # R_MARKER_AXIS_FIX), so this stops base_link 0.45 m before the
      # marker. The marker is 0.2 m in front of the charger origin, so the
      # fork tips (base_link + 0.436) end ~0.19 m short of the housing and
      # the camera (base_link + 0.16) ~0.29 m in front of the marker. With
      # -0.1/-0.2 the forks drove under the housing and jammed.
      external_detection_translation_x: -0.2
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: 0.0
      external_detection_rotation_pitch: 0.0
      external_detection_rotation_yaw: -0.0
      filter_coef: 0.1
      use_battery_status: false
      use_stall_detection: false

    # charging_dock:
    #   plugin: "opennav_docking::SimpleChargingDock"
    #   use_external_detection_pose: false   # blind -- database pose + odom only
    #   docking_threshold: 0.08              # loosened, no live correction
    #   docking_threshold_angular: 0.08
    #   staging_x_offset: -0.7
    #   staging_yaw_offset: 3.14159          # face away from dock at staging, so backing in is a straight reverse
    #   use_battery_status: false

    station_dock:
      plugin: "opennav_docking::SimpleChargingDock"
      docking_threshold: 0.05
      docking_threshold_angular: 0.05
      staging_x_offset: -0.7
      staging_yaw_offset: 0.0
      use_external_detection_pose: true
      external_detection_timeout: 1.0
      external_detection_translation_x: 0.0
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: 0.0
      external_detection_rotation_pitch: 0.0
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1
      use_battery_status: false
      

    pallet_pick_dock:
      plugin: "opennav_docking::SimpleChargingDock"
      docking_threshold: 0.1
      docking_threshold_angular: 0.05
      staging_x_offset: -0.7
      staging_yaw_offset: 0.0
      detector_service_name: 'detector/toggle'
      detector_service_timeout: 5.0
      subscribe_toggle: true
      use_external_detection_pose: true
      external_detection_timeout: 3.0
      external_detection_translation_x: 0.1
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: 0.0
      external_detection_rotation_pitch: 0.0
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1
      use_battery_status: false

    pallet_drop_dock:
      plugin: "opennav_docking::SimpleChargingDock"
      docking_threshold: 0.1
      docking_threshold_angular: 0.05
      staging_x_offset: -0.7
      staging_yaw_offset: 0.0
      use_external_detection_pose: false
      # external_detection_timeout: 1.0
      # external_detection_translation_x: 0.0
      # external_detection_translation_y: 0.0
      # external_detection_rotation_roll: 0.0
      # external_detection_rotation_pitch: 0.0
      # external_detection_rotation_yaw: 0.0
      filter_coef: 0.1
      use_battery_status: false

    # --- Approach controller (shared across all dock types) ---
    controller:
      k_phi: 3.0
      k_delta: 2.0
      beta: 0.4
      lambda: 2.0
      v_linear_min: 0.05
      v_linear_max: 0.15
      v_angular_max: 0.6
      slowdown_radius: 0.25
      use_collision_detection: true
      costmap_topic: "namespace/local_costmap/costmap_raw"
      footprint_topic: "namespace/local_costmap/published_footprint"
      transform_tolerance: 0.1
      projection_time: 5.0
      simulation_time_step: 0.1
      dock_collision_threshold: 0.2