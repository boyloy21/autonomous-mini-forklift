controller_server:
  ros__parameters:
    use_sim_time: True
    scan_topic: "namespace/scan"
    odom_topic: "namespace/odom"
    cmd_vel_topic: "namespace/cmd_vel"
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.15
      movement_time_allowance: 25.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.15
    # DWB parameters.
    FollowPath:
      # primary_controller: "dwb_core::DWBLocalPlanner"
      plugin: "dwb_core::DWBLocalPlanner"

      # DWB parameters
      debug_trajectory_details: True

      min_vel_x: -0.0
      min_vel_y: 0.0
      max_vel_x: 0.4
      max_vel_y: 0.0
      max_vel_theta: 1.0

      min_speed_xy: 0.0
      max_speed_xy: 0.4
      min_speed_theta: 0.25

      acc_lim_x: 2.5
      acc_lim_y: 0.0
      acc_lim_theta: 3.5

      decel_lim_x: -2.5
      decel_lim_y: 0.0
      decel_lim_theta: -3.5

      vx_samples: 12
      vy_samples: 5
      vtheta_samples: 20

      sim_time: 2.0
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.15
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: True
      limit_vel_cmd_in_traj: False
      stateful: True

      critics:
        [
          "BaseObstacle",
          "GoalAlign",
          "GoalDist",
          "PathAlign",
          "PathDist",
          "RotateToGoal",
          "Oscillation"
        ]

      BaseObstacle.scale: 0.3
      PathAlign.scale: 40.0
      GoalAlign.scale: 8.0
      PathAlign.forward_point_distance: 0.2
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 40.0
      GoalDist.scale: 8.0
      RotateToGoal.scale: 45.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: 0.4


controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: True

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: True
      rolling_window: true
      map_topic: namespace/map
      width: 5
      height: 5
      resolution: 0.05
      footprint: '[[0.3,0.3],[0.3,-0.3],[-0.3,-0.3],[-0.3,0.3]]'
      plugins: ["obstacle_layer","voxel_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: namespace/scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.1
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # See controller_mppi.yaml's local_costmap inflation_layer comment --
        # 0.7 exceeded the measured ~0.65m clearance near the drop-dock
        # turn, choking off forward progress there.
        cost_scaling_factor: 5.0
        inflation_radius: 0.45
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: False
        origin_z: 0.0
        z_resolution: 0.2
        z_voxels: 10
        max_obstacle_height: 2.0
        mark_threshold: 1
        observation_sources: scan
        scan:
          topic: namespace/scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True
  local_costmap_client:
    ros__parameters:
      use_sim_time: True
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: True
  
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: True
      footprint: '[[0.3,0.3],[0.3,-0.3],[-0.3,-0.3],[-0.3,0.3]]'
      resolution: 0.05
      track_unknown_space: true
      map_topic: namespace/map
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        enabled: true
        subscribe_to_updates: true
        transform_tolerance: 0.1
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: namespace/scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.1
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.8
      always_send_full_costmap: True
  global_costmap_client:
    ros__parameters:
      use_sim_time: True
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: True
