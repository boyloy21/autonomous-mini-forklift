controller_server:
  ros__parameters:
    use_sim_time: True
    scan_topic: "namespace/scan"
    odom_topic: "namespace/odom"
    cmd_vel_topic: "namespace/cmd_vel"
    controller_frequency: 30.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # Progress checker
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 15.0

    # Goal checker
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.2
      yaw_goal_tolerance: 0.2
      stateful: True
    
    # MPPI parameters
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      vx_std: 0.15
      vy_std: 0.2
      wz_std: 0.3
      vx_max: 0.6
      vx_min: -0.2
      vy_max: 0.5
      wz_max: 1.0
      wz_min: -1.0
      ax_max: 3.2
      ax_min: -3.0
      ay_min: -3.0
      ay_max: 3.0
      az_max: 3.5
      # xy_goal_tolerance: 0.15
      iteration_count: 1
      prune_distance: 1.8
      transform_tolerance: 0.1
      temperature: 0.15   # Controls exploration vs exploitation (0.1-0.5) (Higher: More random exploration, better obstacle avoidance, Lower: More deterministic, smoother paths)
      gamma: 0.04           # Discount factor for future costs (0.01-0.05) (Higher: Focus on immediate costs, more reactive, Lower: Consider future costs, more planning)
      motion_model: "DiffDrive"
      visualize: false
      reset_period: 1.0 # (only in Humble)
      regenerate_noises: false
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      # UNVERIFIED: this plugin block may not exist in Humble's MPPI
      # backport (matches a repeated pattern this whole project has hit
      # with other newer-Nav2-release features). Check with:
      #   ros2 param list /forklift1/controller_server | grep -i "TrajectoryValidator"
      # If nothing shows up after launch, this block is silently
      # ignored -- harmless, but remove it to avoid confusion about what
      # the config is actually doing.
      TrajectoryValidator:
        plugin: "mppi::DefaultOptimalTrajectoryValidator"
        collision_lookahead_time: 2.0
        consider_footprint: false
      # REMOVED: AckermannConstraints (min_turning_r: 0.4). This applies
      # to car-like steering vehicles with a genuine minimum turning
      # radius from steering geometry. motion_model is explicitly
      # "DiffDrive" above -- a differential-drive robot can rotate in
      # place and has no minimum turning radius. Keeping both was a
      # direct contradiction; at best inert, at worst artificially
      # restricting legitimate in-place turns this robot can actually do.
      # Cost weights
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic", 
                "PathAlignCritic", "PathFollowCritic", "PathAngleCritic",
                "PreferForwardCritic", "ObstaclesCritic", "TwirlingCritic", 
                "VelocityDeadbandCritic"]

      # Enforce kinematic constraints (2.0-5.0)
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 7.0  # (Higher: More physically feasible trajectories, Lower: More aggressive, potentially infeasible)

      # Move toward goal position (4-10)
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 6.5    # Higher: More goal-directed, faster arrival, Lower: More path-focused, smoother approach
        threshold_to_consider: 1.2

      # Align with final goal orientation (1-8)
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 12.0    # Higher: Better goal alignment, but can cause over-rotation,  Lower: Smoother approach, but may not align perfectly
        threshold_to_consider: 0.4

      # Prefer forward movement over backward/reverse
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 18.0     # (5-125)
        threshold_to_consider: 0.5    # Reduced from 0.5

      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 4.0
        critical_weight: 35.0
        consider_footprint: false
        collision_cost: 30000.0
        collision_margin_distance: 0.18
        near_goal_distance: 0.7
        inflation_radius: 0.55
        cost_scaling_factor: 16.0

      # Costmap-based obstacle avoidance
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0   # Higher: Very obstacle-aware, conservative movement, Lower: More aggressive, closer to obstacles
        critical_cost: 750.0
        consider_footprint: true
        collision_cost: 1500000.0
        near_goal_distance: 0.6
        trajectory_point_step: 2

      # Align robot orientation with path direction (Higher: Tighter path following, better straight lines, Lower: More deviation from path, smoother around obstacles)
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 22.0    # Raised from 16 -- route_server paths need a firmer pull to stay aligned
        max_path_occupancy_ratio: 0.06
        trajectory_point_step: 3
        threshold_to_consider: 0.4    # Reduced from 0.5
        offset_from_furthest: 6       # Reduced from 10 -- evaluate closer to the robot, tighter local tracking
        use_path_orientations: false

      # Increase PathFollowCritic for better straight line tracking  Follow path position (not orientation)
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 24.0     # Raised from 18 -- stronger pull back onto the path line itself
        offset_from_furthest: 5       # Reduced from 7, matches PathAlign's tighter lookahead
        threshold_to_consider: 1.0    # Reduced from 1.4

      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 7.0
        offset_from_furthest: 10
        threshold_to_consider: 0.22
        max_angle_to_furthest: 0.30
        mode: 0
      
      VelocityDeadbandCritic:
        enabled: true
        cost_power: 1
        cost_weight: 28.0
        deadband_velocities: [0.015, 0.015, 0.015]
      TwirlingCritic:
        enabled: true
        twirling_cost_power: 1
        twirling_cost_weight: 12.0
    

controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: True
    


local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: True
      rolling_window: true
      map_topic: namespace/map
      width: 5
      height: 5
      resolution: 0.05
      footprint: '[[0.3,0.3],[0.3,-0.3],[-0.3,-0.3],[-0.3,0.3]]'
      plugins: ["obstacle_layer", "virtual_layer", "voxel_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: namespace/scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.1
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      virtual_layer:
        plugin: "nav2_virtual_layer::VirtualLayer"
        map_frame: map
        forms_file: "package://forklift_navigation/config/virtual_layer/namespace.yaml"
        enable_visualization: false
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # See controller_mppi.yaml's local_costmap inflation_layer comment --
        # 0.7 exceeded the measured ~0.65m clearance near the drop-dock
        # turn, choking off forward progress there.
        cost_scaling_factor: 5.0
        inflation_radius: 0.45
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: False
        origin_z: 0.0
        z_resolution: 0.2
        z_voxels: 10
        max_obstacle_height: 2.0
        mark_threshold: 1
        observation_sources: scan
        scan:
          topic: namespace/scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True
  local_costmap_client:
    ros__parameters:
      use_sim_time: True
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: True
  
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: True
      footprint: '[[0.3,0.3],[0.3,-0.3],[-0.3,-0.3],[-0.3,0.3]]'
      resolution: 0.05
      track_unknown_space: true
      map_topic: namespace/map
      plugins: ["static_layer", "virtual_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        enabled: true
        subscribe_to_updates: true
        transform_tolerance: 0.1
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: namespace/scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.1
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      virtual_layer:
        plugin: "nav2_virtual_layer::VirtualLayer"
        enabled: true
        map_frame: map
        default_cost_level: 254
        # launch replaces "namespace" -> "/forklift1" => .../virtual_layer//forklift1.yaml
        forms_file: "package://forklift_navigation/config/virtual_layer/namespace.yaml"
        enable_visualization: true
        visualization_rate: 1.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.8
      always_send_full_costmap: True
  global_costmap_client:
    ros__parameters:
      use_sim_time: True
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: True
